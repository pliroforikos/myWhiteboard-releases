<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Cosmic Blue/Violet) -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Ribbon Gradient Segment 1 (Left down-stroke: Sky to Royal Blue) -->
    <linearGradient id="wGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Ribbon Gradient Segment 2 (Middle up-stroke: Royal Blue to Violet) -->
    <linearGradient id="wGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Ribbon Gradient Segment 3 (Middle down-stroke: Violet to Magenta) -->
    <linearGradient id="wGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Ribbon Gradient Segment 4 (Right up-stroke & splash: Magenta to Coral Amber) -->
    <linearGradient id="wGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="neonGlow4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad4)" filter="url(#shadow4)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Subtle Whiteboard Slate Frame inside -->
  <rect x="52" y="52" width="408" height="408" rx="84" fill="#0b0f19" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Delicate Dot Grid on Canvas -->
  <g opacity="0.15" fill="#38bdf8">
    <circle cx="100" cy="100" r="2.5"/> <circle cx="150" cy="100" r="2.5"/> <circle cx="200" cy="100" r="2.5"/> <circle cx="256" cy="100" r="2.5"/> <circle cx="312" cy="100" r="2.5"/> <circle cx="362" cy="100" r="2.5"/> <circle cx="412" cy="100" r="2.5"/>
    <circle cx="100" cy="160" r="2.5"/> <circle cx="150" cy="160" r="2.5"/> <circle cx="200" cy="160" r="2.5"/> <circle cx="256" cy="160" r="2.5"/> <circle cx="312" cy="160" r="2.5"/> <circle cx="362" cy="160" r="2.5"/> <circle cx="412" cy="160" r="2.5"/>
    <circle cx="100" cy="220" r="2.5"/> <circle cx="150" cy="220" r="2.5"/> <circle cx="200" cy="220" r="2.5"/> <circle cx="256" cy="220" r="2.5"/> <circle cx="312" cy="220" r="2.5"/> <circle cx="362" cy="220" r="2.5"/> <circle cx="412" cy="220" r="2.5"/>
    <circle cx="100" cy="280" r="2.5"/> <circle cx="150" cy="280" r="2.5"/> <circle cx="200" cy="280" r="2.5"/> <circle cx="256" cy="280" r="2.5"/> <circle cx="312" cy="280" r="2.5"/> <circle cx="362" cy="280" r="2.5"/> <circle cx="412" cy="280" r="2.5"/>
    <circle cx="100" cy="340" r="2.5"/> <circle cx="150" cy="340" r="2.5"/> <circle cx="200" cy="340" r="2.5"/> <circle cx="256" cy="340" r="2.5"/> <circle cx="312" cy="340" r="2.5"/> <circle cx="362" cy="340" r="2.5"/> <circle cx="412" cy="340" r="2.5"/>
    <circle cx="100" cy="400" r="2.5"/> <circle cx="150" cy="400" r="2.5"/> <circle cx="200" cy="400" r="2.5"/> <circle cx="256" cy="400" r="2.5"/> <circle cx="312" cy="400" r="2.5"/> <circle cx="362" cy="400" r="2.5"/> <circle cx="412" cy="400" r="2.5"/>
  </g>

  <!-- Dynamic Glowing Ribbon 'W' -->
  <g filter="url(#ribbonShadow)">
    <!-- Underlying glow -->
    <path d="M 112 148 L 180 364 L 256 220 L 332 364 L 400 148"
          fill="none" stroke="#9333ea" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#neonGlow4)"/>

    <!-- Stroke 1: Left Down -->
    <path d="M 112 148 L 180 364"
          fill="none" stroke="url(#wGrad1)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stroke 2: Center Up -->
    <path d="M 180 364 L 256 220"
          fill="none" stroke="url(#wGrad2)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stroke 3: Center Down -->
    <path d="M 256 220 L 332 364"
          fill="none" stroke="url(#wGrad3)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stroke 4: Right Up -->
    <path d="M 332 364 L 400 148"
          fill="none" stroke="url(#wGrad4)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Overlay highlight curves on the ribbon bends for 3D depth -->
  <circle cx="180" cy="364" r="14" fill="#3b82f6" opacity="0.6"/>
  <circle cx="256" cy="220" r="14" fill="#c084fc" opacity="0.6"/>
  <circle cx="332" cy="364" r="14" fill="#f43f5e" opacity="0.6"/>

  <!-- Energy Marker Tip at Top Right of W -->
  <g transform="translate(400, 148)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24" filter="url(#neonGlow4)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    
    <!-- Sparkle rays -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Small floating creative bubbles / marks -->
  <circle cx="92" cy="180" r="6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="424" cy="240" r="8" fill="#f59e0b" opacity="0.6"/>
  <circle cx="256" cy="150" r="5" fill="#a855f7" opacity="0.5"/>
</svg>